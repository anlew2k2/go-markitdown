events {}

http {
    upstream extractor {
        server extractor:8080;
        keepalive 32;
    }

    upstream splitter {
        server splitter:8080;
        keepalive 32;
    }

    server {
        listen 8080;

        location /extractor/ {
            proxy_pass http://extractor/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /splitter/ {
            proxy_pass http://splitter/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
