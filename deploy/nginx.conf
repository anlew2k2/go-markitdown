events {}

http {
    upstream extractor {
        server extractor:8080;
    }

    upstream splitter {
        server splitter:8080;
    }

    server {
        listen 8080;

        location /splitter/ {
            proxy_pass http://splitter/;
        }

        location /extractor/ {
            proxy_pass http://extractor/;
        }
    }
}
