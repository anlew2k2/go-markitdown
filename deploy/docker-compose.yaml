services:
  extractor:
    cpus: 2.0
    mem_limit: 1g
    build:
      context: ..
      dockerfile: deploy/extractor.dockerfile
    environment:
      SERVICE_MODE: worker
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-split-files}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/app/extractor", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  splitter:
    cpus: 1.0
    mem_limit: 512m
    build:
      context: ..
      dockerfile: deploy/splitter.dockerfile
    environment:
      SERVICE_MODE: worker
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-split-files}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/app/splitter", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional HTTP mode front door. The worker pipeline above does not depend
  # on nginx at all; this is only useful if you also run an instance of
  # splitter/extractor with SERVICE_MODE=http.
  nginx:
    image: nginx:1.27-alpine
    expose:
      - "8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - extractor
      - splitter

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minio-data:
  redis-data:
