services:
  extractor:
    cpus: 2.0
    mem_limit: 1g
    build:
      context: ..
      dockerfile: deploy/extractor.dockerfile
    expose:
      - "8080"
    depends_on:
      - minio
      - redis

  splitter:
    cpus: 1.0
    mem_limit: 512m
    build:
      context: ..
      dockerfile: deploy/splitter.dockerfile
    expose:
      - "8080"
    depends_on:
      - minio
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - extractor
      - splitter

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
  redis-data:
